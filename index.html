<!doctype html>
<html lang="en" data-public>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salmon Sashimi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGPU studio scene; editorial title block at left, compact control card at right (bottom sheet on phones). */
:root {
  color-scheme: light;
  --paper: #efe8de;
  --ink: #2b2220;
  --muted: #7b6a62;
  --accent: #e0643c;
  --line: rgba(43, 34, 32, 0.13);
  --card: rgba(250, 246, 240, 0.74);
  --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
.hint {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 36px);
  margin: 0; font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--ink);
  opacity: 0.72; pointer-events: none; white-space: nowrap; transition: opacity 0.6s ease;
}
.panel {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 44px);
  right: max(44px, env(safe-area-inset-right, 0px));
  width: 272px; box-sizing: border-box; padding: 18px; display: grid; gap: 16px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  max-height: calc(100% - 88px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
}
.group { display: grid; gap: 8px; }
.label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.preset {
  font: inherit; font-size: 12px; font-weight: 500; color: var(--ink);
  display: grid; justify-items: center; gap: 6px; padding: 8px 4px 7px;
  background: transparent; border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.preset i { width: 22px; height: 22px; border-radius: 50%; background: var(--sw); box-shadow: inset 0 -3px 6px rgba(0,0,0,0.12), inset 0 2px 4px rgba(255,255,255,0.35); }
.preset[aria-checked="true"] { border-color: var(--ink); background: rgba(255,255,255,0.5); }
.slider { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px 10px; }
.slider label { font-weight: 500; }
.slider .val { display: flex; align-items: baseline; gap: 3px; color: var(--muted); font-size: 12px; }
.slider .num { width: 46px; font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); text-align: right; padding: 1px 4px; background: transparent; border: 1px solid transparent; border-radius: 6px; -moz-appearance: textfield; }
.slider .num:hover, .slider .num:focus { border-color: var(--line); background: rgba(255,255,255,0.6); }
.slider .num::-webkit-inner-spin-button { display: none; }
.export { width: 100%; box-sizing: border-box; height: 64px; font: 11px/1.4 ui-monospace, monospace; color: var(--ink); background: rgba(255,255,255,0.6); border: 1px solid var(--line); border-radius: 8px; padding: 6px; resize: vertical; }
.slider input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
.buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn {
  font: inherit; font-weight: 500; color: var(--ink); min-height: 38px; padding: 0 10px;
  background: rgba(255,255,255,0.55); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.btn.primary { grid-column: 1 / -1; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.toggles { display: flex; gap: 14px; }
.toggle { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-weight: 500; cursor: pointer; min-height: 28px; }
.toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
[data-public] .panel { display: none; }
.soft-btn { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); font: inherit; font-weight: 500; color: var(--ink); min-height: 38px; padding: 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
@media (max-width: 760px) { .soft-btn { bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); } :root:not([data-public]) .soft-btn { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); } }   /* public copy (github.io): no controls */
.panel-head { grid-column: 1 / -1; display: flex; align-items: center; font: inherit; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); background: none; border: 0; padding: 0; min-height: 24px; cursor: pointer; }
.panel-head::after { content: "−"; margin-left: auto; font-size: 16px; letter-spacing: 0; color: var(--ink); }
.panel.collapsed > :not(.panel-head) { display: none; }
.panel.collapsed .panel-head::after { content: "+"; }
.more { border-top: 1px solid var(--line); padding-top: 12px; }
.more summary { cursor: pointer; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); min-height: 24px; display: flex; align-items: center; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: "+"; margin-left: auto; font-size: 16px; letter-spacing: 0; color: var(--ink); }
.more[open] summary::after { content: "−"; }
.more-body { display: grid; gap: 14px; padding-top: 12px; }
.more + .more { margin-top: -6px; }
.contents { display: contents; }
.link { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.segbtn { font: inherit; font-size: 12px; font-weight: 500; color: var(--ink); min-height: 32px; background: transparent; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.segbtn[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.color-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 500; }
.color-row input { width: 48px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fallback {
  position: fixed; inset: 0; display: grid; place-items: end center; text-align: center;
  padding-bottom: max(14vh, 40px); padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
.fallback div { max-width: 40ch; display: grid; gap: 10px; }
.fallback strong { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: 34px; }
.fallback p { margin: 0; color: var(--muted); line-height: 1.55; }
@media (max-width: 760px) {
  .hint { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 14px); font-size: 18px; opacity: 0.8; }
  .panel {
    top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    width: auto; padding: 14px; gap: 12px; grid-template-columns: 1fr 1fr;
  }
  .panel > .group.wide { grid-column: 1 / -1; }
  .panel { max-height: min(calc(100% - 150px), 54%); }
  .more-body { grid-template-columns: 1fr 1fr; }
  .more-body > .wide { grid-column: 1 / -1; }
  .buttons { grid-template-columns: 1.4fr 1fr 1fr; }
  .btn.primary { grid-column: auto; }
  .preset { grid-auto-flow: column; padding: 6px; gap: 6px; }
  .preset i { width: 16px; height: 16px; }
}
</style>

<canvas id="scene" aria-label="A translucent slice of raw salmon on a black plate. Drag any point of the slice to pull and stretch it."></canvas>

<p class="hint" id="hint">Grab. Stretch. Let go.</p>
<button class="soft-btn" id="soft" type="button" aria-pressed="false">Soft</button>

<aside class="panel collapsed" id="panel" aria-label="Simulation controls">
  <button class="panel-head" id="panel-head" type="button" aria-expanded="false">Settings</button>
  <div class="group wide">
    <span class="label" id="cut-label">Cut</span>
    <div class="presets" role="radiogroup" aria-labelledby="cut-label">
      <button class="preset" id="p-atlantic" type="button" role="radio" aria-checked="true" data-preset="atlantic" style="--sw:#f2683a"><i></i>Atlantic</button>
      <button class="preset" id="p-sockeye" type="button" role="radio" aria-checked="false" data-preset="sockeye" style="--sw:#f05347"><i></i>Sockeye</button>
      <button class="preset" id="p-belly" type="button" role="radio" aria-checked="false" data-preset="belly" style="--sw:#f4a87c"><i></i>Belly</button>
    </div>
  </div>
  <div class="group wide">
    <span class="label" id="style-label">Style</span>
    <div class="seg" role="radiogroup" aria-labelledby="style-label" style="grid-template-columns: 1fr 1fr">
      <button class="segbtn stylebtn" type="button" role="radio" aria-checked="false" data-style="classic">Classic</button>
      <button class="segbtn stylebtn" type="button" role="radio" aria-checked="true" data-style="natural">Natural</button>
    </div>
  </div>
  <div class="contents" id="g-main"></div>
  <div class="buttons group wide">
    <button class="btn primary" id="nudge" type="button">Give it a nudge</button>
    <button class="btn" id="reset" type="button">Reset</button>
    <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
  </div>
  <div class="toggles group wide">
    <label class="toggle"><input id="mesh" type="checkbox">Mesh</label>
    <label class="toggle"><input id="slow" type="checkbox">¼ speed</label>
    <label class="toggle"><input id="plate" type="checkbox" checked>Plate</label>
  </div>
  <details class="more group wide">
    <summary>Shape</summary>
    <div class="more-body" id="g-shape"></div>
  </details>
  <details class="more group wide">
    <summary>Pattern</summary>
    <div class="more-body">
      <button class="btn wide" id="shuffle" type="button">New pattern</button>
      <div class="contents" id="g-pattern"></div>
    </div>
  </details>
  <details class="more group wide">
    <summary>Physics</summary>
    <div class="more-body" id="g-physics"></div>
  </details>
  <details class="more group wide">
    <summary>Light &amp; camera</summary>
    <div class="more-body" id="g-view"></div>
  </details>
  <details class="more group wide">
    <summary>Look &amp; mesh</summary>
    <div class="more-body">
      <div class="group wide">
        <span class="label" id="res-label">Mesh resolution</span>
        <div class="seg" role="radiogroup" aria-labelledby="res-label">
          <button class="segbtn" id="r-coarse" type="button" role="radio" aria-checked="false" data-res="coarse">Coarse</button>
          <button class="segbtn" id="r-medium" type="button" role="radio" aria-checked="true" data-res="medium">Medium</button>
          <button class="segbtn" id="r-fine" type="button" role="radio" aria-checked="false" data-res="fine">Fine</button>
        </div>
      </div>
      <div class="contents" id="g-look"></div>
      <div class="color-row wide">
        <label for="flesh">Flesh color</label>
        <input id="flesh" type="color" value="#f2683a">
      </div>
      <div class="color-row wide">
        <label for="plate-color">Plate color</label>
        <input id="plate-color" type="color" value="#161413">
      </div>
      <div class="color-row wide">
        <label for="wasabi-color">Wasabi color</label>
        <input id="wasabi-color" type="color" value="#9fb85a">
      </div>
      <div class="color-row wide">
        <label for="bg-color">Background</label>
        <input id="bg-color" type="color" value="#f1eee9">
      </div>
    </div>
  </details>
  <details class="more group wide">
    <summary>Developer</summary>
    <div class="more-body" id="g-dev"></div>
  </details>
  <div class="buttons group wide">
    <button class="link" id="defaults" type="button">Restore defaults</button>
    <button class="link" id="export" type="button">Copy settings</button>
  </div>
  <textarea class="export group wide" id="export-box" readonly hidden aria-label="Current settings"></textarea>
</aside>

<div class="fallback" id="fallback" hidden>
  <div>
    <strong>This scene needs WebGPU.</strong>
    <p id="fallback-msg">Your browser did not provide a WebGPU device. Open the page in a recent Chrome, Edge or Safari with WebGPU turned on.</p>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// SIM-BEGIN
// Volumetric soft body: hexahedral lattice split into tetrahedra, solved with XPBD
// (edge-length and tetrahedral-volume constraints) at a fixed 120 Hz step with substeps.
// The rest shape is a salmon block cross-section: the skin edge (k = 0) is the longest and thickest; the inner
// edge is shorter (taper), thinner (wedge) and bowed out; the ends are cut on a slant; the top undulates (ripple).
function createSim(NX = 14, NY = 4, NZ = 7, shape = {}, copies = 1) {
  const sh = { length: 2.6, width: 1.2, thick: 0.4, slant: 0.42, taper: 0.2, wedge: 0.22, bow: 0.7, ripple: 0.04, ...shape };
  const L = sh.length, H = sh.thick, W = sh.width;   // 1 unit = 20 mm: 52 x 8 x 24 mm by default
  const tn = Math.tan(sh.slant);
  const Nb = NX * NY * NZ, C = Math.max(1, copies | 0), N = Nb * C;   // C pieces, each a contiguous block of Nb nodes
  const OFF = 100;   // rest-space x offset between pieces, so self-collision never treats two pieces as neighbours
  const cScale = (NX - 1) / 13;                  // per-edge compliance ~ 1/edge length keeps the material the same at any resolution
  const id = (i, j, k) => (k * NY + j) * NX + i;
  const rest = new Float32Array(N * 3);
  for (let c = 0; c < C; c++) for (let k = 0; k < NZ; k++) for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const u = i / (NX - 1), y = j / (NY - 1), v = k / (NZ - 1), n = (c * Nb + id(i, j, k)) * 3;
    const th = H * (1 + sh.wedge * (0.5 - v)) * (1 + sh.ripple * Math.sin(u * 5.3 + 1.1) * Math.sin(v * 3.1 + 0.4));
    rest[n] = (u - 0.5) * L * (1 - sh.taper * v) + (v - 0.5) * W * tn + c * OFF;
    rest[n + 1] = y * th;
    rest[n + 2] = (v - 0.5) * W + sh.bow * 0.12 * W * Math.sin(Math.PI * u) * v;
  }
  const P = rest;
  const vol6 = (X, a, b, c, d) => {
    const ax = X[a * 3], ay = X[a * 3 + 1], az = X[a * 3 + 2];
    const ux = X[b * 3] - ax, uy = X[b * 3 + 1] - ay, uz = X[b * 3 + 2] - az;
    const vx = X[c * 3] - ax, vy = X[c * 3 + 1] - ay, vz = X[c * 3 + 2] - az;
    const wx = X[d * 3] - ax, wy = X[d * 3 + 1] - ay, wz = X[d * 3 + 2] - az;
    return (uy * vz - uz * vy) * wx + (uz * vx - ux * vz) * wy + (ux * vy - uy * vx) * wz;
  };
  const perms = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  const tl = [];
  for (let b = 0; b < C; b++) for (let k = 0; k < NZ - 1; k++) for (let j = 0; j < NY - 1; j++) for (let i = 0; i < NX - 1; i++) for (const p of perms) {
    const c = [i, j, k], q = [b * Nb + id(...c)];
    for (let s = 0; s < 3; s++) { c[p[s]]++; q.push(b * Nb + id(...c)); }
    if (vol6(P, q[0], q[1], q[2], q[3]) < 0) { const t = q[1]; q[1] = q[2]; q[2] = t; }
    tl.push(...q);
  }
  const NT = tl.length / 4, tet = Int32Array.from(tl), tetRest = new Float32Array(NT);
  const mass = new Float32Array(N), w = new Float32Array(N);
  for (let t = 0; t < NT; t++) {
    const v6 = vol6(P, tet[4 * t], tet[4 * t + 1], tet[4 * t + 2], tet[4 * t + 3]);
    tetRest[t] = v6;
    for (let s = 0; s < 4; s++) mass[tet[4 * t + s]] += v6 / 24;
  }
  for (let i = 0; i < N; i++) w[i] = 1 / mass[i];
  const eset = new Set(), el = [];
  for (let t = 0; t < NT; t++) for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) {
    let p = tet[4 * t + a], q = tet[4 * t + b]; if (p > q) { const s = p; p = q; q = s; }
    if (!eset.has(p * N + q)) { eset.add(p * N + q); el.push(p, q); }
  }
  const NE = el.length / 2, edge = Int32Array.from(el), eRest = new Float32Array(NE), eSoft = new Float32Array(NE);
  for (let e = 0; e < NE; e++) {
    const a = edge[2 * e] * 3, b = edge[2 * e + 1] * 3;
    eRest[e] = Math.hypot(P[b] - P[a], P[b + 1] - P[a + 1], P[b + 2] - P[a + 2]);
    // Skin side (k = 0, away from the camera) is the firmer "rind": silver skin layer and the dark chiai band.
    const v = 1 - (Math.floor(edge[2 * e] % Nb / (NX * NY)) + Math.floor(edge[2 * e + 1] % Nb / (NX * NY))) / 2 / (NZ - 1);
    const s = Math.min(Math.max((v - 0.72) / 0.24, 0), 1);
    eSoft[e] = 1 / (1 + 3 * s * s * (3 - 2 * s));
  }

  const x = new Float32Array(N * 3), xp = new Float32Array(N * 3), vel = new Float32Array(N * 3);
  const prm = { compliance: 0.03, damping: 1.4, gravity: 80, substeps: 6, dt: 1 / 120, friction: 0.7, anchor: 0.04, slip: 0.12, volCompliance: 3e-4, stretch: 2.2, grab: 0.16, obs: null };
  const ax = new Float32Array(N), az = new Float32Array(N), held = new Uint8Array(N);
  const grabs = new Set();
  const BOUND_X = 4.2, BOUND_Z = 3.4;
  // Self-collision between surface nodes that are far apart at rest (a folded slice must not pass through itself).
  const surf = [];
  for (let c = 0; c < C; c++) for (let k = 0; k < NZ; k++) for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++)
    if (!i || i === NX - 1 || !j || j === NY - 1 || !k || k === NZ - 1) surf.push(c * Nb + id(i, j, k));
  const NS = surf.length, SD = 0.65 * Math.max(L / (NX - 1), W / (NZ - 1)), SX2 = Math.max(0.6, 3 * SD) ** 2;
  const HB = 1024, head = new Int32Array(HB), next = new Int32Array(NS), cell = new Int32Array(NS * 3);
  const hash = (a, b, c) => ((a * 73856093) ^ (b * 19349663) ^ (c * 83492791)) & (HB - 1);
  function selfCollide() {
    head.fill(-1);
    for (let s = 0; s < NS; s++) {
      const k = surf[s] * 3, a = Math.floor(x[k] / SD), b = Math.floor(x[k + 1] / SD), c = Math.floor(x[k + 2] / SD);
      cell[s * 3] = a; cell[s * 3 + 1] = b; cell[s * 3 + 2] = c;
      const hh = hash(a, b, c); next[s] = head[hh]; head[hh] = s;
    }
    for (let s = 0; s < NS; s++) {
      const p = surf[s], pk = p * 3;
      for (let da = -1; da <= 1; da++) for (let db = -1; db <= 1; db++) for (let dc = -1; dc <= 1; dc++) {
        const a = cell[s * 3] + da, b = cell[s * 3 + 1] + db, c = cell[s * 3 + 2] + dc;
        for (let t = head[hash(a, b, c)]; t >= 0; t = next[t]) {
          if (t <= s || cell[t * 3] !== a || cell[t * 3 + 1] !== b || cell[t * 3 + 2] !== c) continue;
          const q = surf[t], qk = q * 3;
          const rx = P[qk] - P[pk], ry = P[qk + 1] - P[pk + 1], rz = P[qk + 2] - P[pk + 2];
          if (rx * rx + ry * ry + rz * rz < SX2) continue;
          const dx = x[qk] - x[pk], dy = x[qk + 1] - x[pk + 1], dz = x[qk + 2] - x[pk + 2], d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (d >= SD || d < 1e-9) continue;
          const f = (SD - d) / d / (w[p] + w[q]);
          x[pk] -= dx * f * w[p]; x[pk + 1] -= dy * f * w[p]; x[pk + 2] -= dz * f * w[p];
          x[qk] += dx * f * w[q]; x[qk + 1] += dy * f * w[q]; x[qk + 2] += dz * f * w[q];
        }
      }
    }
  }

  function place(lift, tiltX, tiltZ, yaw) {
    const cx = Math.cos(tiltX), sx = Math.sin(tiltX), cz = Math.cos(tiltZ), sz = Math.sin(tiltZ);
    for (let i = 0; i < N; i++) {
      const c = Math.floor(i / Nb), yc = Math.cos(yaw + c * 0.9), ys = Math.sin(yaw + c * 0.9);   // extra pieces stack higher, turned
      let px = P[i * 3] - c * OFF, py = P[i * 3 + 1] - H / 2, pz = P[i * 3 + 2];

  // many thin fat lines across the main sheets (along the muscle fibres, material x), wavy
  // each line (per gap between main sheets) gets its own random offset, presence, strength, width and reach
  let q3 = m.z / W * u.ex2.z + (n1.x - 0.5) * 1.2 + (n2.y - 0.5) * 0.5;
  let k3 = vec2f(floor(q3), floor(P.ph + 0.5));
  let h3 = vec4f(hash12(k3), hash12(k3 + 17.3), hash12(k3 + 41.7), hash12(k3 + 73.1));
  let cw = W / max(u.ex2.z, 1.0);   // line cell width; a line wider than its cell is cut into blocks
  let d3 = abs(fract(q3) - 0.5 - (h3.x - 0.5) * mix(0.6, 0.4, st)) * cw;
  let w3 = min(wd * (0.4 + 0.9 * h3.w), mix(1e3, cw * 0.28, st));
  let near = exp(-max(d - wd, 0.0) / (0.045 * (0.5 + 1.2 * h3.z) * (0.6 + n2.x)));   // unbroken, fading with distance from the main sheet
  fat = max(fat, smoothstep(w3, w3 * 0.13, d3) * near * smoothstep(0.2, 0.45, h3.y) * (0.45 + 0.55 * h3.z) * u.ex2.w);
  fat = max(fat, smoothstep(0.70, 0.86, n2.z) * u.sigA.w);
  fat = max(fat, smoothstep(0.09, 0.0, v + (n2.w - 0.5) * 0.06) * 0.65);
  let fb = N4(m * vec3f(0.25, 2.4, 2.0) + vec3f(u.pat.xy, 0.5)).y;
  let shade = (mix(0.82, 0.93, st) + mix(0.36, 0.14, st) * n1.w + 0.18 * smoothstep(sp * 0.45, 0.0, d)) * (1.0 + u.pat2.w * (fb - 0.5));
  var sA = u.sigA.xyz / shade;
  var sS = u.sigS.xyz * shade;
  let chiai = smoothstep(0.83, 0.94, v) * (1.0 - smoothstep(0.972, 0.99, v));
  sA = mix(sA, vec3f(1.6, 7.0, 7.5), chiai * u.fatC.w);
  sS = mix(sS, vec3f(2.2, 1.1, 1.0), chiai * u.fatC.w);
  let skin = smoothstep(mix(0.95, 0.93, st), mix(0.995, 0.985, st), v);
  sA = mix(sA, mix(vec3f(1.8, 1.9, 1.7), vec3f(1.2, 1.25, 1.2), st), skin);   // natural: greyish white fat layer
  sS = mix(sS, vec3f(10.0, 10.0, 10.5), skin);
  sA = mix(sA, vec3f(0.06, 0.16, 0.32), fat);
  sS = mix(sS, u.fatC.xyz, fat);
  return Med(sA * u.misc.z, sS * u.misc.y);
}
// anisotropic GGX: ay > ax stretches the highlight across the fibres, like a sheen on brushed grain
fn ggxA(h: vec3f, n: vec3f, t: vec3f, b: vec3f, ax: f32, ay: f32) -> f32 {
  let x = dot(h, t) / ax; let y = dot(h, b) / ay; let z = dot(h, n);
  let d = x * x + y * y + z * z;
  return 1.0 / (3.14159 * ax * ay * d * d);
}
fn envColor(r: vec3f) -> vec3f {
  let l = normalize(u.light.xyz);
  let box = smoothstep(0.55, 0.97, dot(r, l));
  let sky = smoothstep(-0.05, 0.6, r.y);
  let wall = u.scene.xyz * (KEY * 1.5 * 0.77 + AMB * 0.55) * 0.8;
  return mix(wall * 0.9, wall * 1.25, sky) + KEY * box * box * 1.8;
}
const STEPS: i32 = 16;
// distance from material point m to the slice's surface along material direction d
fn exitDist(m: vec3f, d: vec3f) -> f32 {
  let sf = select(vec3f(-1e-5), vec3f(1e-5), d >= vec3f(0.0)) + d;
  let tb = (select(vec3f(0.0), u.dims.xyz, d > vec3f(0.0)) - m) / sf;
  return max(min(min(tb.x, tb.y), tb.z), 0.0);
}
@fragment fn fsSlice(i: VOut) -> @location(0) vec4f {
  let J = mat3x3f(i.j0, i.j1, i.j2);
  let Ji = inv3(J);
  let V = normalize(u.cam.xyz - i.wp);
  var n = normalize(i.n);
  // moist micro-relief and muscle fibre streaks, defined in material space so they ride with the flesh
  let bq = i.m * vec3f(0.8, 1.1, 1.1) + vec3f(0.3, 0.1, 0.7);
  let e = 0.006;
  let b0 = N4(bq).w;
  let gm = vec3f(N4(bq + vec3f(e, 0.0, 0.0)).w - b0, N4(bq + vec3f(0.0, e, 0.0)).w - b0, N4(bq + vec3f(0.0, 0.0, e)).w - b0) / e * vec3f(0.8, 1.1, 1.1);
  let gw = transpose(Ji) * gm;
  // myomeres bulge slightly between the fat lines, so each line sits in a shallow groove
  let ge = 0.012;
  let g0 = groove(i.m);
  let gg = transpose(Ji) * (vec3f(groove(i.m + vec3f(ge, 0.0, 0.0)), groove(i.m + vec3f(0.0, ge, 0.0)), groove(i.m + vec3f(0.0, 0.0, ge))) - g0) / ge;
  // fine grain: fibre bundles (~0.3-1 mm) streaking along material x; faded out where a pixel covers several
  let gs = vec3f(0.8, 5.0, 4.0) / u.wasabi.w;
  let gq = i.m * gs + vec3f(u.pat.xy, 0.37);
  let ee = 0.01;
  let q0 = N4(gq).z;
  // only on the cut faces (material y); on the sides the streaks ran across the view and read as blotchy shadows
  let topF = smoothstep(0.6, 0.85, abs(normalize(transpose(J) * n).y));
  let gf = (1.0 - smoothstep(0.006 * u.wasabi.w, 0.03 * u.wasabi.w, length(fwidth(i.m)))) * u.ex2.x * topF;
  let gr = transpose(Ji) * ((vec3f(N4(gq + vec3f(ee, 0.0, 0.0)).z, N4(gq + vec3f(0.0, ee, 0.0)).z, N4(gq + vec3f(0.0, 0.0, ee)).z) - q0) / ee * gs);
  let ns = normalize(n - u.ex.z * (gw - n * dot(gw, n)) - u.misc.w * (gg - n * dot(gg, n)));
  n = normalize(ns - gf * (gr - ns * dot(gr, ns)));
  // the grain also shades the scattered light, so it reads even with weak reflections
  let gshade = clamp(1.0 + mix(2.6, 1.8, u.plate.w) * (dot(n, normalize(u.light.xyz)) - dot(ns, normalize(u.light.xyz))), 0.5, 1.5);
  let ft = i.j0 - n * dot(i.j0, n);
  let tt = select(normalize(cross(n, vec3f(0.0, 0.0, 1.0))), normalize(ft), length(ft) > 1e-4);
  let bt = cross(n, tt);
  let nv0 = dot(n, V);
  if (nv0 < 0.03) { n = normalize(n + V * (0.03 - nv0)); }
  let rd = refract(-V, n, 1.0 / 1.34);
  let dm = Ji * rd;
  let dml = max(length(dm), 1e-4);
  let dmn = dm / dml;
  let hi = u.dims.xyz;
  let safe = select(vec3f(-1e-5), vec3f(1e-5), dmn >= vec3f(0.0)) + dmn;
  let tb = (select(vec3f(0.0), hi, dmn > vec3f(0.0)) - i.m) / safe;
  let texit = clamp(min(min(tb.x, tb.y), tb.z), 0.0, 2.4);
  let ds = texit / f32(STEPS);
  let lm = normalize(Ji * u.light.xyz);
  let upm = normalize(Ji * vec3f(0.0, 1.0, 0.0));
  let fA = u.sigA.xyz * u.misc.z; let fS = u.sigS.xyz * u.misc.y;
  let sEff = sqrt(3.0 * fA * (fA + fS * 0.35));
  var T = vec3f(1.0);
  var acc = vec3f(0.0);
  let jit = 0.35 + 0.3 * hash12(i.p.xy);
  // light entering through the face being viewed (keeps side faces orange instead of deep red)
  let face = KEY * u.light.w * 0.55 * max(0.4 * u.plate.w + (1.0 - 0.4 * u.plate.w) * dot(n, normalize(u.light.xyz)), 0.0) + AMB * 0.6;
  for (var s = 0; s < STEPS; s++) {
    let m = i.m + dmn * ((f32(s) + jit) * ds);
    let md = medium(m);
    let sT = md.sA + md.sS;
    let top = exitDist(m, upm);
    let dl = min(exitDist(m, lm), 2.0);
    let Li = max(KEY * u.light.w * exp(-sEff * dl) + AMB * 0.75 * exp(-sEff * top * 0.8), face * exp(-sEff * (f32(s) + jit) * ds)) + AMB * 0.12;
    let st = exp(-sT * ds);
    acc += T * (md.sS / max(sT, vec3f(1e-3))) * (1.0 - st) * Li;
    T *= st;
  }
  let ep = i.wp + rd * (texit / dml);
  let cp = u.vp * vec4f(ep, 1.0);
  let suv = vec2f(cp.x / cp.w * 0.5 + 0.5, 0.5 - cp.y / cp.w * 0.5);
  let bg = textureSampleLevel(bgTex, sClamp, suv, 0.0).rgb;
  var col = acc * gshade + T * bg;
  let nv = max(dot(n, V), 0.0);
  let F = 0.022 + 0.978 * pow(1.0 - nv, 5.0);
  let l = normalize(u.light.xyz);
  let h = normalize(l + V);
  let nh = max(dot(n, h), 0.0);
  let nl = max(dot(n, l), 0.0);
  let Fh = 0.022 + 0.978 * pow(1.0 - max(dot(h, V), 0.0), 5.0);
  let an = 1.0 + u.ex2.y;
  let spec = (ggxA(h, n, tt, bt, u.ex.y, u.ex.y * an) * 0.55 + ggxA(h, n, tt, bt, u.ex.y * 3.7, u.ex.y * 3.7 * an) * 0.45) * Fh * nl * u.light.w * u.ex.x;
  let luma = dot(col, vec3f(0.2126, 0.7152, 0.0722));
  col = max(mix(vec3f(luma), col, 1.18), vec3f(0.0));        // the filmic curve mutes saturated flesh; win it back
  let Fr = F * u.ex.x;
  col = col * (1.0 - Fr) + envColor(reflect(-V, n)) * Fr + KEY * spec;
  return vec4f(tonemap(col), 1.0);
}

// ---- wasabi: grated, moist, faintly translucent
struct WO { @builtin(position) p: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f };
@vertex fn vsWasabi(@location(0) pos: vec3f, @location(1) nrm: vec3f) -> WO { return WO(u.vp * vec4f(pos, 1.0), pos, nrm); }
@fragment fn fsWasabi(i: WO) -> @location(0) vec4f {
  let V = normalize(u.cam.xyz - i.wp);
  let q = i.wp * vec3f(2.2, 2.6, 2.2) + vec3f(0.3, 0.6, 0.1);
  let e = 0.01;
  let h0 = N4(q).x;
  let g = vec3f(N4(q + vec3f(e, 0.0, 0.0)).x - h0, N4(q + vec3f(0.0, e, 0.0)).x - h0, N4(q + vec3f(0.0, 0.0, e)).x - h0) / e;
  let n = normalize(i.n - 0.05 * (g - i.n * dot(g, i.n)));
  let l = normalize(u.light.xyz);
  let alb = u.wasabi.xyz * (0.84 + 0.32 * N4(q * 1.7).y);
  let wrap = max((dot(n, l) + 0.35) / 1.35, 0.0);
  let cav = 0.7 + 0.3 * smoothstep(0.3, 0.7, h0);
  var col = alb * (KEY * u.light.w * 0.75 * wrap + AMB * 0.6) * cav;
  col += alb * 0.14 * u.light.w * pow(max(dot(-V, l), 0.0), 2.0);
  let F = 0.03 + 0.97 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
  let h = normalize(l + V);
  let t = normalize(cross(n, vec3f(0.0, 0.0, 1.0)));
  col += KEY * ggxA(h, n, t, cross(n, t), 0.16, 0.16) * F * max(dot(n, l), 0.0) * u.light.w * 0.6 * u.ex.x;
  col = col * (1.0 - F * 0.3) + envColor(reflect(-V, n)) * F * 0.3 * u.ex.x;
  return vec4f(tonemap(col), 1.0);
}

// ---- mesh overlay
@vertex fn vsLine(@location(0) p: vec3f) -> @builtin(position) vec4f {
  var c = u.vp * vec4f(p, 1.0);
  c.z -= 0.0006 * c.w;
  return c;
}
@fragment fn fsLineFront() -> @location(0) vec4f { return vec4f(0.10, 0.06, 0.06, 0.62); }
@fragment fn fsLineBack() -> @location(0) vec4f { return vec4f(0.10, 0.06, 0.06, 0.13); }
`;

// Flesh color -> absorption and scattering per material unit (20 mm): the multiple-scattering
// look of a channel with reflectance R needs a single-scatter albedo of about 1 - (1 - R)^1.6.
function fleshOptics(hex) {
  const T = [7.7, 7.6, 10], sA = [], sS = [];
  for (let c = 0; c < 3; c++) {
    const v = parseInt(hex.slice(1 + 2 * c, 3 + 2 * c), 16) / 255;
    const R = v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    const a = Math.min(Math.max(1 - Math.pow(1 - R, 1.6), 0.02), 0.985);
    sS.push(a * T[c]); sA.push((1 - a) * T[c]);
  }
  return { sA, sS };
}

  const pWasabi = P({ vertex: { module: mod, entryPoint: 'vsWasabi', buffers: [{ arrayStride: 72, attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x3' }, { shaderLocation: 1, offset: 12, format: 'float32x3' }] }] }, fragment: { module: mod, entryPoint: 'fsWasabi', targets: [{ format }] }, primitive: { topology: 'triangle-list', cullMode: 'none' }, depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' }, multisample: ms });
  const pLineB = P({ vertex: { module: mod, entryPoint: 'vsLine', buffers: [nodeLayout] }, fragment: { module: mod, entryPoint: 'fsLineBack', targets: [{ format, blend }] }, primitive: { topology: 'line-list' }, depthStencil: noDepth, multisample: ms });
  const pLineF = P({ vertex: { module: mod, entryPoint: 'vsLine', buffers: [nodeLayout] }, fragment: { module: mod, entryPoint: 'fsLineFront', targets: [{ format, blend }] }, primitive: { topology: 'line-list' }, depthStencil: { format: 'depth24plus', depthWriteEnabled: false, depthCompare: 'less-equal' }, multisample: ms });

  const ubuf = device.createBuffer({ size: 384, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const U = new Float32Array(96);

  const shadowTex = device.createTexture({ size: [512, 512], format: 'rgba16float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
  const NS = 64, noiseTex = device.createTexture({ size: [NS, NS, NS], dimension: '3d', format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
  device.queue.writeTexture({ texture: noiseTex }, makeNoise3D(NS), { bytesPerRow: NS * 4, rowsPerImage: NS }, [NS, NS, NS]);
  const sRep = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'repeat', addressModeV: 'repeat', addressModeW: 'repeat' });
  const sClamp = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
  const bgShadow = device.createBindGroup({ layout: pShadow.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
  const bgGround = device.createBindGroup({ layout: pGround.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }, { binding: 1, resource: shadowTex.createView() }] });
  const wasabi = buildWasabi();
  const wvbuf = device.createBuffer({ size: wasabi.vb.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(wvbuf, 0, wasabi.vb);
  const wibuf = device.createBuffer({ size: wasabi.index.byteLength, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST }); device.queue.writeBuffer(wibuf, 0, wasabi.index);
  const bgWasabi = device.createBindGroup({ layout: pWasabi.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }, { binding: 3, resource: noiseTex.createView() }, { binding: 4, resource: sRep }] });
  const bgLine = device.createBindGroup({ layout: pLineF.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
  const bgLineB = device.createBindGroup({ layout: pLineB.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });
  let bgTex, msTex, depthTex, bgBlit, bgSlice, W = 0, H = 0;
  const look = {}, light = [0, 1, 0, 2];
  function applyView() {
    const rad = Math.PI / 180, a = val('litAz') * rad, e = val('litEl') * rad;
    light[0] = Math.cos(e) * Math.sin(a); light[1] = Math.sin(e); light[2] = Math.cos(e) * Math.cos(a); light[3] = 2 * val('litI') / 100;
    if (W) layout();
  }

  // ---------- camera fitted to the free area between the title and the panel
  let VP, IVP, eye;
  function layout() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const cw = innerWidth, ch = innerHeight;
    W = Math.max(1, Math.round(cw * dpr)); H = Math.max(1, Math.round(ch * dpr));
    canvas.width = W; canvas.height = H;
    for (const t of [bgTex, msTex, depthTex]) t && t.destroy();
    bgTex = device.createTexture({ size: [W, H], format: 'rgba16float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    msTex = device.createTexture({ size: [W, H], format, sampleCount: SAMPLES, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    depthTex = device.createTexture({ size: [W, H], format: 'depth24plus', sampleCount: SAMPLES, usage: GPUTextureUsage.RENDER_ATTACHMENT });
    bgBlit = device.createBindGroup({ layout: pBlit.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }, { binding: 2, resource: bgTex.createView() }, { binding: 5, resource: sClamp }] });
    bgSlice = device.createBindGroup({ layout: pSlice.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }, { binding: 2, resource: bgTex.createView() }, { binding: 3, resource: noiseTex.createView() }, { binding: 4, resource: sRep }, { binding: 5, resource: sClamp }] });
    const pr = $('#panel').getBoundingClientRect();
    // Free area: left of the panel on wide screens, above the bottom sheet on phones.
    const areas = !pr.width ? [[0, 48, cw, ch - 70]] : cw > 760 ? [[0, 0, pr.left - 16, ch - 70]] : [[0, 48, cw, pr.top]];
    let best = null, fit = 0;
    for (const a of areas) { const f = Math.min(Math.max(a[2] - a[0], 1) / 6.0, Math.max(a[3] - a[1], 1) / 3.4); if (f > fit) { fit = f; best = a; } }
    const [fx0, fy0, fx1, fy1] = best;
    const rad = Math.PI / 180, fov = val('fov') * rad, el = val('camEl') * rad, az = val('camAz') * rad;
    const dist = Math.min(Math.max(ch / (2 * Math.tan(fov / 2) * fit), 4.5), 40) / (val('zoom') / 100);
    const tgt = [0, 0.1, 0.05];
    eye = [tgt[0] + Math.sin(az) * Math.cos(el) * dist, tgt[1] + Math.sin(el) * dist, tgt[2] + Math.cos(az) * Math.cos(el) * dist];
    const proj = m4.persp(fov, cw / ch, 0.1, 60);
    proj[8] = -((fx0 + fx1) / cw - 1); proj[9] = -(1 - (fy0 + fy1) / ch);
    VP = m4.mul(proj, m4.look(eye, tgt, [0, 1, 0]));
    IVP = m4.inv(VP);
  }

  // ---------- state & controls (sliders are generated from SETTINGS)
  let preset = PRESETS.atlantic, flesh = fleshOptics(preset.color), paused = false, slow = false, meshOn = false;
  const fleshIn = $('#flesh'), pointers = new Map();
  for (const s of SETTINGS) {
    const el = document.createElement('div'); el.className = 'slider group';
    const r = `min="${s.min}" max="${s.max}" step="${s.step || 1}" value="${s.v}"`;
    el.innerHTML = `<label for="${s.id}">${s.label}</label><span class="val"><input class="num" type="number" ${r} aria-label="${s.label} value">${s.unit || ''}</span><input id="${s.id}" type="range" ${r}>`;
    $('#g-' + s.g).append(el);
    s.el = el.querySelector('input[type=range]'); s.out = el.querySelector('.num');
  }
  const S = Object.fromEntries(SETTINGS.map(s => [s.id, s]));
  const val = id => +S[id].el.value;
  function applyParams() {
    const p = sim.prm;
    p.compliance = 0.25 * Math.pow(0.008 / 0.25, val('firm') / 100) * preset.soft;
    p.damping = 0.6 * Math.pow(25, val('damp') / 100);
    p.volCompliance = 1e-2 * Math.pow(10, -3 * val('vol') / 100);
    p.anchor = Math.pow(0.004, val('stick') / 100);
    p.stretch = val('stretch'); p.gravity = val('grav'); p.friction = val('fric'); p.grab = val('grab') / 20;
  }
  function applyLook() {
    look.density = Math.pow(3, (50 - val('clear')) / 50);              // 0: 3x denser, 100: 3x clearer
    look.fat = 0.15 + 1.85 * Math.pow(val('fatamt') / 100, 1.12);       // 50 -> 1
    look.spacing = val('spacing') / 100; look.chiai = val('chiai') / 100;
    look.bend = 0.8 * val('bend') / 100; look.arc = val('arc') / 100;
    look.irr = val('irr') / 35; look.branch = 1.5 * val('branch') / 100;
    look.fibre = 1.5 * val('fibre') / 100; look.groove = 0.004 * val('groove') / 100;
    look.refl = val('refl') / 100;
    look.rough = 0.1 - 0.08 * val('gloss') / 100;                       // 50 -> 0.06
    look.relief = 0.012 * val('relief') / 100;
    look.exposure = Math.pow(2, (val('expo') - 50) / 50);
    look.thin = 0.9 * val('thin') / 100; look.thinN = val('thinN');
    look.grain = 0.03 * val('grain') / 100; look.grainSize = val('grainSize') / 100; look.sheen = 4 * val('sheen') / 100;

  }
  const show = s => { s.out.value = s.el.value; };
  const apply = { dev: () => build(), main: applyParams, physics: applyParams, look: applyLook, pattern: applyLook, view: applyView, shape: () => build(false) };
  // pattern seed: noise offsets and the apex of the line bend
  const seed = [0, 0, 0.42];
  $('#shuffle').addEventListener('click', () => { seed[0] = Math.random() * 8; seed[1] = Math.random() * 8; seed[2] = 0.25 + Math.random() * 0.35; });
  for (const s of SETTINGS) {
    show(s); s.el.addEventListener('input', () => { show(s); apply[s.g](); });
    s.out.addEventListener('change', () => { s.el.value = s.out.value; show(s); apply[s.g](); });   // typed values snap to the slider's range
  }
  // Copy settings: every value as one line, so it can be pasted back as the new defaults.
  $('#export').addEventListener('click', () => {
    const o = { style: Object.keys(STYLES).find(k => STYLES[k] === style), preset: Object.keys(PRESETS).find(k => PRESETS[k] === preset), res, seed: seed.map(v => +v.toFixed(3)), flesh: fleshIn.value, bg: $('#bg-color').value, plateColor: $('#plate-color').value, wasabi: $('#wasabi-color').value, plate: $('#plate').checked };
    for (const s of SETTINGS) o[s.id] = val(s.id);
    const box = $('#export-box'); box.value = JSON.stringify(o); box.hidden = false; box.select();
    try { navigator.clipboard.writeText(box.value).then(() => { $('#export').textContent = 'Copied'; }, () => {}); } catch (_) {}
  });
  $('#defaults').addEventListener('click', () => {
    for (const s of SETTINGS) { s.el.value = style.v[s.id] ?? s.v; show(s); }
    const fc = preset === PRESETS.atlantic ? style.flesh : preset.color; fleshIn.value = fc; flesh = fleshOptics(fc);
    $('#bg-color').value = '#f1eee9'; $('#plate-color').value = '#161413'; $('#wasabi-color').value = '#9fb85a'; $('#plate').checked = true; applyScene();
    applyLook(); applyView(); build(false);
  });
  fleshIn.addEventListener('input', () => { flesh = fleshOptics(fleshIn.value); });
  // Style: a second set of defaults plus the shader variant (s) closer to the reference photos
  const STYLES = {
    classic: { s: 0, flesh: '#f2683a', v: {} },
    natural: { s: 1, flesh: '#f2703f', v: { irr: 25, fatamt: 45, fibre: 30, chiai: 20, refl: 25, gloss: 60, grain: 35, grainSize: 120 } },
  };
  let style = STYLES.natural;
  const styleIds = Object.keys(STYLES.natural.v);
  function setStyle(name) {
    style = STYLES[name];
    document.querySelectorAll('.stylebtn').forEach(o => o.setAttribute('aria-checked', String(o.dataset.style === name)));
    for (const id of styleIds) { S[id].el.value = style.v[id] ?? S[id].v; show(S[id]); }
    if (preset === PRESETS.atlantic) { fleshIn.value = style.flesh; flesh = fleshOptics(style.flesh); }
    applyLook();
  }
  document.querySelectorAll('.stylebtn').forEach(b => b.addEventListener('click', () => setStyle(b.dataset.style)));
  const scene = { plate: true };
  const lin = hex => [1, 3, 5].map(o => { const v = parseInt(hex.slice(o, o + 2), 16) / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  function applyScene() {
    scene.bg = lin($('#bg-color').value); scene.plateColor = lin($('#plate-color').value); scene.wasabi = lin($('#wasabi-color').value); scene.plate = $('#plate').checked;
    document.body.style.background = $('#bg-color').value;
  }
  for (const id of ['#bg-color', '#plate-color', '#wasabi-color', '#plate']) $(id).addEventListener('input', applyScene);
  applyScene();
  canvas.addEventListener('wheel', ev => {   // the wheel drives the Zoom slider
    ev.preventDefault();
    const z = S.zoom.el; z.value = +z.value * Math.exp(-ev.deltaY * 0.0015); z.dispatchEvent(new Event('input'));
  }, { passive: false });
  setStyle('natural'); applyView(); build();
  layout(); addEventListener('resize', layout);
  $('#panel-head').onclick = () => {
    const c = $('#panel').classList.toggle('collapsed');
    $('#panel-head').setAttribute('aria-expanded', String(!c));
    layout();   // the free area for the camera changes with the panel size on phones
  };
  document.querySelectorAll('[data-res]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-res]').forEach(o => o.setAttribute('aria-checked', String(o === b)));
    res = b.dataset.res; build();
  }));
  document.querySelectorAll('.more').forEach(d => d.addEventListener('toggle', layout));
  document.querySelectorAll('.preset').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.preset').forEach(o => o.setAttribute('aria-checked', String(o === b)));
    preset = PRESETS[b.dataset.preset]; const fc = preset === PRESETS.atlantic ? style.flesh : preset.color; fleshIn.value = fc; flesh = fleshOptics(fc); applyParams();
  }));
  $('#nudge').addEventListener('click', () => sim.nudge());
  // Soft/Hard (the one control on the public page): switches Firmness and drops the slice again; the label names the other mode
  const SOFT_FIRM = 15, softBtn = $('#soft');
  softBtn.addEventListener('click', () => {
    const on = softBtn.getAttribute('aria-pressed') !== 'true';
    softBtn.setAttribute('aria-pressed', String(on)); softBtn.textContent = on ? 'Hard' : 'Soft';
    S.firm.el.value = on ? SOFT_FIRM : S.firm.v; S.firm.el.dispatchEvent(new Event('input'));
    pointers.clear(); sim.reset(); xPrev.set(sim.x);
  });
  $('#reset').addEventListener('click', () => { pointers.clear(); sim.reset(); xPrev.set(sim.x); });
  const pauseBtn = $('#pause');
  pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.setAttribute('aria-pressed', String(paused)); pauseBtn.textContent = paused ? 'Resume' : 'Pause'; });
  $('#mesh').addEventListener('change', e => { meshOn = e.target.checked; });
  $('#slow').addEventListener('change', e => { slow = e.target.checked; });

  // ---------- pointer: ray pick on the deformed skin, drag on a camera-facing plane
  function ray(ev) {
    const r = canvas.getBoundingClientRect();
    const nx = (ev.clientX - r.left) / r.width * 2 - 1, ny = 1 - (ev.clientY - r.top) / r.height * 2;
    const tr = (z) => { const v = [nx, ny, z, 1], o = [0, 0, 0, 0]; for (let i = 0; i < 4; i++) for (let k = 0; k < 4; k++) o[i] += IVP[k * 4 + i] * v[k]; return [o[0] / o[3], o[1] / o[3], o[2] / o[3]]; };
    const a = tr(0), b = tr(1), d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], l = Math.hypot(...d);
    return [a, d.map(c => c / l)];
  }
  canvas.addEventListener('pointerdown', ev => {
    const [ro, rd] = ray(ev);
    const hit = pickSkin(skin, ro, rd);
    if (!hit) return;
    ev.preventDefault();
    try { canvas.setPointerCapture(ev.pointerId); } catch (_) {}
    const nrm = [eye[0] - hit[0], eye[1] - hit[1], eye[2] - hit[2]], l = Math.hypot(...nrm);
    pointers.set(ev.pointerId, { g: sim.grab(hit), p0: hit, n: nrm.map(c => c / l) });
    canvas.style.cursor = 'grabbing';
    $('#hint').style.opacity = '0';
  });
  canvas.addEventListener('pointermove', ev => {
    const P0 = pointers.get(ev.pointerId);
    if (!P0) {
      if (ev.pointerType === 'mouse' && !pointers.size) { const [ro, rd] = ray(ev); canvas.style.cursor = pickSkin(skin, ro, rd) ? 'grab' : 'default'; }
      return;
    }
    const [ro, rd] = ray(ev), n = P0.n;
    const den = rd[0] * n[0] + rd[1] * n[1] + rd[2] * n[2]; if (Math.abs(den) < 1e-5) return;
    const t = ((P0.p0[0] - ro[0]) * n[0] + (P0.p0[1] - ro[1]) * n[1] + (P0.p0[2] - ro[2]) * n[2]) / den;
    const q = [ro[0] + rd[0] * t, ro[1] + rd[1] * t, ro[2] + rd[2] * t];
    q[1] = Math.min(Math.max(q[1], 0.04), 6); q[0] = Math.min(Math.max(q[0], -2.4), 2.4); q[2] = Math.min(Math.max(q[2], -1.8), 1.8);
    P0.g.t[0] = q[0]; P0.g.t[1] = q[1]; P0.g.t[2] = q[2];
  });
  const end = ev => { const P0 = pointers.get(ev.pointerId); if (!P0) return; sim.release(P0.g); pointers.delete(ev.pointerId); if (!pointers.size) canvas.style.cursor = 'grab'; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

  // ---------- frame
  let last = performance.now(), acc = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (!paused) {
      acc += dt * (slow ? 0.25 : 1);
      let n = 0; while (acc >= sim.prm.dt && n < 6) { xPrev.set(sim.x); sim.step(); acc -= sim.prm.dt; n++; }
      if (n === 6) acc = 0;
    }
    const al = Math.min(acc / sim.prm.dt, 1), x = sim.x;
    for (let i = 0; i < x.length; i++) xr[i] = xPrev[i] + (x[i] - xPrev[i]) * al;
    updateSkin(skin, xr);
    device.queue.writeBuffer(vbuf, 0, skin.vb);
    if (meshOn) device.queue.writeBuffer(nbuf, 0, xr);
    U.set(VP, 0); U.set(IVP, 16);
    U.set([eye[0], eye[1], eye[2], now / 1000], 32);
    U.set(light, 36);
    U.set([W, H, 1 / W, 1 / H], 40);
    U.set([sim.L, sim.H, sim.W, meshOn ? 1 : 0], 44);
    U.set([0, 0, 4.5, 4.0], 48);
    U.set([...flesh.sA, Math.min(preset.marble * look.fat, 1)], 52);
    U.set([...flesh.sS, preset.width * look.fat], 56);
    U.set([...preset.fat, preset.chiai * look.chiai], 60);
    U.set([preset.spacing * look.spacing, look.density, Math.pow(look.density, 0.4), look.groove], 64);   // clearer flesh loses scattering faster than color
    U.set([look.refl, look.rough, look.relief, look.exposure], 68);
    U.set([seed[0], seed[1], look.bend, look.irr], 72);
    U.set([seed[2], look.arc, look.branch, look.fibre], 76);
    U.set([look.grain, look.sheen, look.thinN, look.thin], 80);
    U.set([...scene.bg, scene.plate ? 1 : 0], 84);
    U.set([...scene.plateColor, style.s], 88);
    U.set([...scene.wasabi, look.grainSize], 92);
    device.queue.writeBuffer(ubuf, 0, U);

    const enc = device.createCommandEncoder();
    let pass = enc.beginRenderPass({ colorAttachments: [{ view: shadowTex.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [-1000, -1000, 0, 0] }] });
    pass.setPipeline(pShadow); pass.setBindGroup(0, bgShadow); pass.setVertexBuffer(0, vbuf); pass.setIndexBuffer(ibuf, 'uint32'); pass.drawIndexed(skin.index.length);
    pass.setVertexBuffer(0, wvbuf); pass.setIndexBuffer(wibuf, 'uint32'); pass.drawIndexed(wasabi.index.length); pass.end();
    pass = enc.beginRenderPass({ colorAttachments: [{ view: bgTex.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    pass.setPipeline(pGround); pass.setBindGroup(0, bgGround); pass.draw(3); pass.end();
    pass = enc.beginRenderPass({
      colorAttachments: [{ view: msTex.createView(), resolveTarget: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'discard', clearValue: [0, 0, 0, 1] }],
      depthStencilAttachment: { view: depthTex.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'discard' },
    });
    pass.setPipeline(pBlit); pass.setBindGroup(0, bgBlit); pass.draw(3);
    pass.setPipeline(pWasabi); pass.setBindGroup(0, bgWasabi); pass.setVertexBuffer(0, wvbuf); pass.setIndexBuffer(wibuf, 'uint32'); pass.drawIndexed(wasabi.index.length);
    pass.setPipeline(pSlice); pass.setBindGroup(0, bgSlice); pass.setVertexBuffer(0, vbuf); pass.setIndexBuffer(ibuf, 'uint32'); pass.drawIndexed(skin.index.length);
    if (meshOn) {
      pass.setVertexBuffer(0, nbuf); pass.setIndexBuffer(ebuf, 'uint32');
      pass.setPipeline(pLineB); pass.setBindGroup(0, bgLineB); pass.drawIndexed(sim.edge.length);
      pass.setPipeline(pLineF); pass.setBindGroup(0, bgLine); pass.drawIndexed(sim.edge.length);
    }
    pass.end();
    device.queue.submit([enc.finish()]);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__salmon = { get sim() { return sim; }, get skin() { return skin; }, device, ray, S, pickSkin: (ro, rd) => pickSkin(skin, ro, rd), get VP() { return VP; } };
}
main().catch(err => {
  console.error(err);
  $('#fallback').hidden = false; for (const s of ['#panel', '#hint']) $(s).hidden = true;
  $('#fallback-msg').textContent = 'WebGPU started but the scene could not be built: ' + (err && err.message ? err.message : err);
});
})();
</script>
